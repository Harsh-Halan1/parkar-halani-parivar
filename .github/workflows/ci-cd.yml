name: CI/CD Pipeline (Offline Testing)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run tests (if configured)
        working-directory: frontend
        run: npm run test --if-present
        continue-on-error: true

  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check TypeScript compilation
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run linter
        working-directory: backend
        run: npm run lint
        continue-on-error: true

      - name: Run tests (if configured)
        working-directory: backend
        run: npm run test --if-present
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-validation:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Check Dockerfile syntax (Backend)
        run: docker build --dry-run -f backend/Dockerfile backend 2>/dev/null || echo "Build validation skipped (environment-dependent)"

      - name: Check Dockerfile syntax (Frontend)
        run: docker build --dry-run -f frontend/Dockerfile frontend 2>/dev/null || echo "Build validation skipped (environment-dependent)"
