<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Announcements management" />
    <title>Announcements - Parakar Halani Parivar</title>
    <link rel="preload" href="/src/style.css" as="style" />
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar" class="navbar">
        <div class="container navbar-flex">
            <div class="navbar-brand">
                <a href="/index.html" class="logo">🌳 Parakar Halani Parivar</a>
            </div>
            <button id="profile-btn-mobile" class="profile-icon mobile-only" aria-label="Profile">👤</button>
            <div class="nav-desktop">
                <ul id="nav-menu" class="nav-menu">
                    <li><a href="/app.html">Home</a></li>
                    <li><a href="/families.html">Families</a></li>
                    <li><a href="/announcements.html" class="active">Announcements</a></li>
                    <li><a href="/members.html">Members</a></li>
                </ul>
                <div class="nav-actions">
                    <div class="lang-dropdown" id="lang-dropdown" aria-label="Language" aria-haspopup="true" aria-expanded="false">
                        <button class="lang-trigger" id="lang-trigger">
                            <span id="lang-current">English</span>
                            <span class="caret">▼</span>
                        </button>
                        <div class="lang-menu" id="lang-menu" role="menu">
                            <button class="lang-item" role="menuitem" data-lang="gu">Gujarati (ગુજરાતી)</button>
                            <button class="lang-item" role="menuitem" data-lang="en">English</button>
                            <button class="lang-item" role="menuitem" data-lang="hi">Hindi (हिन्दी)</button>
                        </div>
                    </div>
                    <div class="user-menu">
                        <button id="profile-btn-desktop" class="profile-icon" aria-label="Profile">👤</button>
                        <span class="user-greeting" id="user-greeting"><span data-i18n="auth.hello">Hello</span>, <span id="user-name">User</span></span>
                        <button id="logout-btn" class="btn btn-outline" data-i18n="nav.logout">Logout</button>
                    </div>
                </div>
            </div>
            <button id="sidebar-toggle" class="hamburger" aria-label="Open Menu" aria-controls="sidebar" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal">
        <div class="modal-content profile-modal-content">
            <button class="modal-close" id="profile-close">&times;</button>
            <div class="profile-modal-header">
                <div class="profile-avatar">👤</div>
                <h2 id="profile-name">User</h2>
                <p id="profile-email">user@email.com</p>
            </div>
            <div class="profile-modal-menu">
                <button class="profile-menu-item" data-i18n="profile.settings">Settings</button>
                <hr>
                <button class="profile-menu-item logout-item" id="profile-logout-btn" data-i18n="nav.logout">Logout</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="logo">🌳 Parakar Halani Parivar</span>
            <button id="sidebar-close" class="sidebar-close" aria-label="Close Menu">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="/app.html">Home</a>
            <a href="/families.html">Families</a>
            <a href="/announcements.html">Announcements</a>
            <a href="/members.html">Members</a>
        </nav>
        <div class="sidebar-actions">
            <div class="lang-dropdown" id="sidebar-lang-dropdown" aria-label="Language" aria-haspopup="true" aria-expanded="false">
                <button class="lang-trigger" id="sidebar-lang-trigger">
                    <span id="sidebar-lang-current">English</span>
                    <span class="caret">▼</span>
                </button>
                <div class="lang-menu" id="sidebar-lang-menu" role="menu">
                    <button class="lang-item" role="menuitem" data-lang="gu">Gujarati (ગુજરાતી)</button>
                    <button class="lang-item" role="menuitem" data-lang="en">English</button>
                    <button class="lang-item" role="menuitem" data-lang="hi">Hindi (हिन्दी)</button>
                </div>
            </div>
            <button id="sidebar-logout-btn" class="btn btn-outline btn-block" data-i18n="nav.logout">Logout</button>
        </div>
    </aside>

    <!-- Announcements Content -->
    <main id="announcements-page" class="page-content">
        <div class="container">
            <header class="page-header">
                <div class="page-header-content">
                    <h1 data-i18n="announcements.title">Announcements</h1>
                    <p class="page-subtitle" data-i18n="announcements.subtitle">View and manage family announcements</p>
                </div>
                <button id="add-announcement-btn" class="btn btn-primary" data-i18n="announcements.addAnnouncement">Add Announcement</button>
            </header>

            <div class="search-bar">
                <input type="text" id="announcement-search" placeholder="Search announcements..." data-i18n-placeholder="announcements.search">
            </div>

            <div id="announcements-list" class="announcements-grid">
                <p data-i18n="common.loading">Loading...</p>
            </div>
        </div>
    </main>

    <!-- Add Announcement Modal -->
    <div id="add-announcement-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="close-add-announcement">&times;</button>
            <h2 data-i18n="announcements.addAnnouncement">Add Announcement</h2>
            <form id="add-announcement-form">
                <input type="text" id="announcement-title-input" placeholder="Title" data-i18n-placeholder="announcements.title" required>
                <textarea id="announcement-description-input" placeholder="Description" data-i18n-placeholder="announcements.description" rows="5"></textarea>
                <input type="date" id="announcement-date-input" required>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="common.save">Save</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from '/src/api.js';
        import api from '/src/api.js';
        import i18next from '/src/i18n.js';
        import { $, on, addClass, removeClass } from '/src/utils.js';
        
        // Check authentication
        if (!auth.isAuthenticated()) {
            window.location.href = '/index.html';
        }

        const user = auth.getUser();
        const userNameEl = $('#user-name');
        if (userNameEl && user) {
            const userName = user.name || user.email?.split('@')[0] || 'User';
            userNameEl.textContent = userName;
        }

        // Profile modal
        const profileModal = $('#profile-modal');
        const profileBtnMobile = $('#profile-btn-mobile');
        const profileBtnDesktop = $('#profile-btn-desktop');
        const profileCloseBtn = $('#profile-close');
        const profileLogoutBtn = $('#profile-logout-btn');
        const sidebarLogoutBtn = $('#sidebar-logout-btn');

        function openProfileModal() {
            if (profileModal) {
                const userInfo = auth.getUser();
                const profileName = $('#profile-name');
                const profileEmail = $('#profile-email');
                if (profileName) profileName.textContent = userInfo?.name || 'User';
                if (profileEmail) profileEmail.textContent = userInfo?.email || 'user@email.com';
                profileModal.classList.add('active');
            }
        }

        function closeProfileModal() {
            if (profileModal) profileModal.classList.remove('active');
        }

        if (profileBtnMobile) on(profileBtnMobile, 'click', openProfileModal);
        if (profileBtnDesktop) on(profileBtnDesktop, 'click', openProfileModal);
        if (profileCloseBtn) on(profileCloseBtn, 'click', closeProfileModal);
        if (profileLogoutBtn) {
            on(profileLogoutBtn, 'click', () => {
                auth.logout();
                window.location.href = '/index.html';
            });
        }
        if (sidebarLogoutBtn) {
            on(sidebarLogoutBtn, 'click', () => {
                auth.logout();
                window.location.href = '/index.html';
            });
        }

        // Sidebar
        const sidebar = $('#sidebar');
        const sidebarToggle = $('#sidebar-toggle');
        const sidebarClose = $('#sidebar-close');

        if (sidebar && sidebarToggle && sidebarClose) {
            on(sidebarToggle, 'click', () => {
                addClass(sidebar, 'active');
                sidebarToggle.setAttribute('aria-expanded', 'true');
            });
            on(sidebarClose, 'click', () => {
                removeClass(sidebar, 'active');
                sidebarToggle.setAttribute('aria-expanded', 'false');
            });
        }

        // Languages
        function setLanguage(lang) {
            localStorage.setItem('language', lang);
            i18next.changeLanguage(lang);
            document.documentElement.lang = lang;
            updateTranslations();
        }

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = i18next.t(key);
            });
        }

        function initLangDropdown(dropdownId, triggerId, menuId) {
            const dropdown = $(dropdownId);
            const trigger = $(triggerId);
            const menu = $(menuId);
            if (!dropdown || !trigger || !menu) return;

            on(trigger, 'click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('active');
            });

            menu.querySelectorAll('.lang-item').forEach(item => {
                on(item, 'click', () => {
                    const lang = item.getAttribute('data-lang');
                    setLanguage(lang);
                    menu.classList.remove('active');
                });
            });
        }

        initLangDropdown('#lang-dropdown', '#lang-trigger', '#lang-menu');
        initLangDropdown('#sidebar-lang-dropdown', '#sidebar-lang-trigger', '#sidebar-lang-menu');

        // Announcements management
        const addAnnouncementBtn = $('#add-announcement-btn');
        const addAnnouncementModal = $('#add-announcement-modal');
        const closeAddAnnouncementBtn = $('#close-add-announcement');
        const addAnnouncementForm = $('#add-announcement-form');
        const announcementsList = $('#announcements-list');
        const announcementSearchInput = $('#announcement-search');

        let announcements = [];

        async function loadAnnouncements() {
            try {
                const response = await api.get('/announcements');
                announcements = Array.isArray(response.data) ? response.data : [];
                renderAnnouncements(announcements);
            } catch (error) {
                console.error('Failed to load announcements:', error);
                if (announcementsList) announcementsList.innerHTML = '<p>Failed to load announcements</p>';
            }
        }

        function renderAnnouncements(list) {
            if (!announcementsList) return;
            if (list.length === 0) {
                announcementsList.innerHTML = '<p style="text-align: center;">No announcements found</p>';
                return;
            }
            announcementsList.innerHTML = list.map(a => {
                const date = a.date ? new Date(a.date).toLocaleDateString() : 'N/A';
                return `
                    <div class="announcement-card">
                        <h3>${a.title || 'Untitled'}</h3>
                        <p class="announcement-date">📅 ${date}</p>
                        <p>${a.description || ''}</p>
                        <div class="announcement-actions">
                            <button class="btn btn-sm btn-outline edit-announcement" data-id="${a.id}">Edit</button>
                            <button class="btn btn-sm btn-danger delete-announcement" data-id="${a.id}">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        if (addAnnouncementBtn) on(addAnnouncementBtn, 'click', () => {
            if (addAnnouncementModal) addAnnouncementModal.classList.add('active');
        });

        if (closeAddAnnouncementBtn) on(closeAddAnnouncementBtn, 'click', () => {
            if (addAnnouncementModal) addAnnouncementModal.classList.remove('active');
        });

        if (addAnnouncementForm) {
            on(addAnnouncementForm, 'submit', async (e) => {
                e.preventDefault();
                const titleInput = $('#announcement-title-input');
                const descInput = $('#announcement-description-input');
                const dateInput = $('#announcement-date-input');
                try {
                    await api.post('/announcements', {
                        title: titleInput.value,
                        description: descInput.value,
                        date: dateInput.value
                    });
                    titleInput.value = '';
                    descInput.value = '';
                    dateInput.value = '';
                    if (addAnnouncementModal) addAnnouncementModal.classList.remove('active');
                    loadAnnouncements();
                } catch (error) {
                    console.error('Failed to add announcement:', error);
                    alert('Failed to add announcement');
                }
            });
        }

        if (announcementSearchInput) {
            on(announcementSearchInput, 'input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = announcements.filter(a => 
                    a.title?.toLowerCase().includes(query) || 
                    a.description?.toLowerCase().includes(query)
                );
                renderAnnouncements(filtered);
            });
        }

        updateTranslations();
        loadAnnouncements();
        console.log('✨ Announcements page loaded');
    </script>
</body>
</html>
