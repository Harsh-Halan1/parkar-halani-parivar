<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Member management" />
    <title>Members - Parakar Halani Parivar</title>
    <link rel="preload" href="/src/style.css" as="style" />
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar" class="navbar">
        <div class="container navbar-flex">
            <div class="navbar-brand">
                <a href="/index.html" class="logo">🌳 Parakar Halani Parivar</a>
            </div>
            <button id="profile-btn-mobile" class="profile-icon mobile-only" aria-label="Profile">👤</button>
            <div class="nav-desktop">
                <ul id="nav-menu" class="nav-menu">
                    <li><a href="/app.html">Home</a></li>
                    <li><a href="/families.html">Families</a></li>
                    <li><a href="/announcements.html">Announcements</a></li>
                    <li><a href="/members.html" class="active">Members</a></li>
                </ul>
                <div class="nav-actions">
                    <div class="lang-dropdown" id="lang-dropdown" aria-label="Language" aria-haspopup="true" aria-expanded="false">
                        <button class="lang-trigger" id="lang-trigger">
                            <span id="lang-current">English</span>
                            <span class="caret">▼</span>
                        </button>
                        <div class="lang-menu" id="lang-menu" role="menu">
                            <button class="lang-item" role="menuitem" data-lang="gu">Gujarati (ગુજરાતી)</button>
                            <button class="lang-item" role="menuitem" data-lang="en">English</button>
                            <button class="lang-item" role="menuitem" data-lang="hi">Hindi (हिन्દી)</button>
                        </div>
                    </div>
                    <div class="user-menu">
                        <button id="profile-btn-desktop" class="profile-icon" aria-label="Profile">👤</button>
                        <span class="user-greeting" id="user-greeting"><span data-i18n="auth.hello">Hello</span>, <span id="user-name">User</span></span>
                        <button id="logout-btn" class="btn btn-outline" data-i18n="nav.logout">Logout</button>
                    </div>
                </div>
            </div>
            <button id="sidebar-toggle" class="hamburger" aria-label="Open Menu" aria-controls="sidebar" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal">
        <div class="modal-content profile-modal-content">
            <button class="modal-close" id="profile-close">&times;</button>
            <div class="profile-modal-header">
                <div class="profile-avatar">👤</div>
                <h2 id="profile-name">User</h2>
                <p id="profile-email">user@email.com</p>
            </div>
            <div class="profile-modal-menu">
                <button class="profile-menu-item" data-i18n="profile.settings">Settings</button>
                <hr>
                <button class="profile-menu-item logout-item" id="profile-logout-btn" data-i18n="nav.logout">Logout</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="logo">🌳 Parakar Halani Parivar</span>
            <button id="sidebar-close" class="sidebar-close" aria-label="Close Menu">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="/app.html">Home</a>
            <a href="/families.html">Families</a>
            <a href="/announcements.html">Announcements</a>
            <a href="/members.html">Members</a>
        </nav>
        <div class="sidebar-actions">
            <div class="lang-dropdown" id="sidebar-lang-dropdown" aria-label="Language" aria-haspopup="true" aria-expanded="false">
                <button class="lang-trigger" id="sidebar-lang-trigger">
                    <span id="sidebar-lang-current">English</span>
                    <span class="caret">▼</span>
                </button>
                <div class="lang-menu" id="sidebar-lang-menu" role="menu">
                    <button class="lang-item" role="menuitem" data-lang="gu">Gujarati (ગુજરાતી)</button>
                    <button class="lang-item" role="menuitem" data-lang="en">English</button>
                    <button class="lang-item" role="menuitem" data-lang="hi">Hindi (हिन્દી)</button>
                </div>
            </div>
            <button id="sidebar-logout-btn" class="btn btn-outline btn-block" data-i18n="nav.logout">Logout</button>
        </div>
    </aside>

    <!-- Members Content -->
    <main id="members-page" class="page-content">
        <div class="container">
            <header class="page-header">
                <div class="page-header-content">
                    <h1 data-i18n="members.title">Members</h1>
                    <p class="page-subtitle" data-i18n="members.subtitle">View and manage family members</p>
                </div>
                <button id="add-member-btn" class="btn btn-primary" data-i18n="members.addMember">Add Member</button>
            </header>

            <div class="search-bar">
                <input type="text" id="member-search" placeholder="Search members..." data-i18n-placeholder="members.search">
            </div>

            <div id="members-list" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="members.name">Name</th>
                            <th data-i18n="members.family">Family</th>
                            <th data-i18n="members.birthDate">Birth Date</th>
                            <th data-i18n="members.actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="members-tbody">
                        <tr><td colspan="4" style="text-align: center;" data-i18n="common.loading">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Member Modal -->
    <div id="add-member-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="close-add-member">&times;</button>
            <h2 data-i18n="members.addMember">Add Member</h2>
            <form id="add-member-form">
                <input type="text" id="member-name-input" placeholder="Name" data-i18n-placeholder="members.name" required>
                <input type="date" id="member-dob-input" data-i18n-placeholder="members.birthDate">
                <select id="member-family-select" required>
                    <option value="" disabled selected data-i18n="members.selectFamily">Select Family</option>
                </select>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="common.save">Save</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from '/src/api.js';
        import api from '/src/api.js';
        import i18next from '/src/i18n.js';
        import { $, on, addClass, removeClass } from '/src/utils.js';
        
        // Check authentication
        if (!auth.isAuthenticated()) {
            window.location.href = '/index.html';
        }

        const user = auth.getUser();
        const userNameEl = $('#user-name');
        if (userNameEl && user) {
            const userName = user.name || user.email?.split('@')[0] || 'User';
            userNameEl.textContent = userName;
        }

        // Profile modal
        const profileModal = $('#profile-modal');
        const profileBtnMobile = $('#profile-btn-mobile');
        const profileBtnDesktop = $('#profile-btn-desktop');
        const profileCloseBtn = $('#profile-close');
        const profileLogoutBtn = $('#profile-logout-btn');
        const sidebarLogoutBtn = $('#sidebar-logout-btn');

        function openProfileModal() {
            if (profileModal) {
                const userInfo = auth.getUser();
                const profileName = $('#profile-name');
                const profileEmail = $('#profile-email');
                if (profileName) profileName.textContent = userInfo?.name || 'User';
                if (profileEmail) profileEmail.textContent = userInfo?.email || 'user@email.com';
                profileModal.classList.add('active');
            }
        }

        function closeProfileModal() {
            if (profileModal) profileModal.classList.remove('active');
        }

        if (profileBtnMobile) on(profileBtnMobile, 'click', openProfileModal);
        if (profileBtnDesktop) on(profileBtnDesktop, 'click', openProfileModal);
        if (profileCloseBtn) on(profileCloseBtn, 'click', closeProfileModal);
        if (profileLogoutBtn) {
            on(profileLogoutBtn, 'click', () => {
                auth.logout();
                window.location.href = '/index.html';
            });
        }
        if (sidebarLogoutBtn) {
            on(sidebarLogoutBtn, 'click', () => {
                auth.logout();
                window.location.href = '/index.html';
            });
        }

        // Sidebar
        const sidebar = $('#sidebar');
        const sidebarToggle = $('#sidebar-toggle');
        const sidebarClose = $('#sidebar-close');

        if (sidebar && sidebarToggle && sidebarClose) {
            on(sidebarToggle, 'click', () => {
                addClass(sidebar, 'active');
                sidebarToggle.setAttribute('aria-expanded', 'true');
            });
            on(sidebarClose, 'click', () => {
                removeClass(sidebar, 'active');
                sidebarToggle.setAttribute('aria-expanded', 'false');
            });
        }

        // Languages
        function setLanguage(lang) {
            localStorage.setItem('language', lang);
            i18next.changeLanguage(lang);
            document.documentElement.lang = lang;
            updateTranslations();
        }

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = i18next.t(key);
            });
        }

        function initLangDropdown(dropdownId, triggerId, menuId) {
            const dropdown = $(dropdownId);
            const trigger = $(triggerId);
            const menu = $(menuId);
            if (!dropdown || !trigger || !menu) return;

            on(trigger, 'click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('active');
            });

            menu.querySelectorAll('.lang-item').forEach(item => {
                on(item, 'click', () => {
                    const lang = item.getAttribute('data-lang');
                    setLanguage(lang);
                    menu.classList.remove('active');
                });
            });
        }

        initLangDropdown('#lang-dropdown', '#lang-trigger', '#lang-menu');
        initLangDropdown('#sidebar-lang-dropdown', '#sidebar-lang-trigger', '#sidebar-lang-menu');

        // Members management
        const addMemberBtn = $('#add-member-btn');
        const addMemberModal = $('#add-member-modal');
        const closeAddMemberBtn = $('#close-add-member');
        const addMemberForm = $('#add-member-form');
        const membersTableBody = $('#members-tbody');
        const memberSearchInput = $('#member-search');
        const familySelect = $('#member-family-select');

        let members = [];
        let families = [];

        async function loadMembers() {
            try {
                const response = await api.get('/persons');
                members = Array.isArray(response.data) ? response.data : [];
                renderMembers(members);
            } catch (error) {
                console.error('Failed to load members:', error);
                if (membersTableBody) membersTableBody.innerHTML = '<tr><td colspan="4">Failed to load members</td></tr>';
            }
        }

        async function loadFamilies() {
            try {
                const response = await api.get('/families');
                families = Array.isArray(response.data) ? response.data : [];
                if (familySelect) {
                    familySelect.innerHTML = '<option value="" disabled selected>Select Family</option>';
                    families.forEach(f => {
                        const option = document.createElement('option');
                        option.value = f.id;
                        option.textContent = f.name;
                        familySelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load families:', error);
            }
        }

        function renderMembers(list) {
            if (!membersTableBody) return;
            if (list.length === 0) {
                membersTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No members found</td></tr>';
                return;
            }
            membersTableBody.innerHTML = list.map(member => {
                const dob = member.dateOfBirth ? new Date(member.dateOfBirth).toLocaleDateString() : 'N/A';
                const familyName = member.family?.name || 'N/A';
                return `
                    <tr>
                        <td>${member.name || 'Unnamed'}</td>
                        <td>${familyName}</td>
                        <td>${dob}</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn btn-sm btn-outline edit-member" data-id="${member.id}">Edit</button>
                                <button class="btn btn-sm btn-danger delete-member" data-id="${member.id}">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        if (addMemberBtn) on(addMemberBtn, 'click', () => {
            if (addMemberModal) addMemberModal.classList.add('active');
        });

        if (closeAddMemberBtn) on(closeAddMemberBtn, 'click', () => {
            if (addMemberModal) addMemberModal.classList.remove('active');
        });

        if (addMemberForm) {
            on(addMemberForm, 'submit', async (e) => {
                e.preventDefault();
                const nameInput = $('#member-name-input');
                const dobInput = $('#member-dob-input');
                try {
                    await api.post('/persons', {
                        name: nameInput.value,
                        dateOfBirth: dobInput.value,
                        familyId: familySelect.value
                    });
                    nameInput.value = '';
                    dobInput.value = '';
                    familySelect.value = '';
                    if (addMemberModal) addMemberModal.classList.remove('active');
                    loadMembers();
                } catch (error) {
                    console.error('Failed to add member:', error);
                    alert('Failed to add member');
                }
            });
        }

        if (memberSearchInput) {
            on(memberSearchInput, 'input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = members.filter(m => m.name?.toLowerCase().includes(query));
                renderMembers(filtered);
            });
        }

        updateTranslations();
        loadFamilies();
        loadMembers();
        console.log('✨ Members page loaded');
    </script>
</body>
</html>
