    <!-- Initialize members page -->
    <script type="module">
        import { auth } from '/src/api.js';
        import api from '/src/api.js';
        import i18next from '/src/i18n.js';
        import { $, on, addClass, removeClass, setActiveNav } from '/src/utils.js';

        // Guard
        if (!auth.isAuthenticated()) {
            window.location.href = '/';
        } else {
            function updateAuthUI() {
                const isAuth = auth.isAuthenticated();
                const user = auth.getUser();
                document.querySelectorAll('.auth-logged-out').forEach(el => el.style.display = isAuth ? 'none' : '');
                document.querySelectorAll('.auth-logged-in').forEach(el => el.style.display = isAuth ? '' : 'none');
                if (isAuth && user) {
                    const userName = user.name || user.email?.split('@')[0] || 'User';
                    const userNameEl = $('#user-name');
                    const sidebarUserNameEl = $('#sidebar-user-name');
                    if (userNameEl) userNameEl.textContent = userName;
                    if (sidebarUserNameEl) sidebarUserNameEl.textContent = userName;
                }
            }

            updateAuthUI();
            setActiveNav();

            const logoutBtn = $('#logout-btn');
            const sidebarLogoutBtn = $('#sidebar-logout-btn');
            if (logoutBtn) on(logoutBtn, 'click', () => { auth.logout(); window.location.href = '/'; });
            if (sidebarLogoutBtn) on(sidebarLogoutBtn, 'click', () => { auth.logout(); window.location.href = '/'; });

            // Sidebar toggle
            const sidebar = $('#sidebar');
            const sidebarToggle = $('#sidebar-toggle');
            const sidebarClose = $('#sidebar-close');
            if (sidebar && sidebarToggle && sidebarClose) {
                on(sidebarToggle, 'click', () => { addClass(sidebar, 'active'); sidebarToggle.setAttribute('aria-expanded', 'true'); });
                on(sidebarClose, 'click', () => { removeClass(sidebar, 'active'); sidebarToggle.setAttribute('aria-expanded', 'false'); });
                document.querySelectorAll('.sidebar-nav a').forEach((link) => {
                    on(link, 'click', () => { removeClass(sidebar, 'active'); sidebarToggle.setAttribute('aria-expanded', 'false'); });
                });
            }

            // Language handling
            function menuLabelFor(code) {
                switch (code) {
                    case 'gu': return 'Gujarati (ગુજરાતી)';
                    case 'hi': return 'Hindi (हिन्दी)';
                    default: return 'English';
                }
            }

            function setLanguage(newLang) {
                localStorage.setItem('language', newLang);
                i18next.changeLanguage(newLang, () => {
                    updateTranslations();
                    document.documentElement.lang = newLang;
                    const langCurrent = $('#lang-current');
                    const sidebarLangCurrent = $('#sidebar-lang-current');
                    if (langCurrent) langCurrent.textContent = menuLabelFor(newLang);
                    if (sidebarLangCurrent) sidebarLangCurrent.textContent = menuLabelFor(newLang);
                });
            }

            function initLangDropdown(dropdownId, triggerId, menuId) {
                const dropdown = $(dropdownId);
                const trigger = $(triggerId);
                const menu = $(menuId);
                if (!dropdown || !trigger || !menu) return;
                const currentLabel = dropdown.querySelector('span#' + (dropdownId.includes('sidebar') ? 'sidebar-lang-current' : 'lang-current'));
                if (currentLabel) currentLabel.textContent = menuLabelFor(i18next.language);
                on(trigger, 'click', (e) => {
                    e.stopPropagation();
                    menu.classList.toggle('active');
                    dropdown.setAttribute('aria-expanded', menu.classList.contains('active'));
                });
                menu.querySelectorAll('.lang-item').forEach((item) => {
                    on(item, 'click', () => {
                        const code = item.getAttribute('data-lang');
                        setLanguage(code);
                        menu.classList.remove('active');
                        dropdown.setAttribute('aria-expanded', 'false');
                    });
                });
            }

            function updateTranslations() {
                document.querySelectorAll('[data-i18n]').forEach((el) => {
                    const key = el.getAttribute('data-i18n');
                    el.textContent = i18next.t(key);
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    const translated = i18next.t(key);
                    if (translated) el.setAttribute('placeholder', translated);
                });
            }

            initLangDropdown('#lang-dropdown', '#lang-trigger', '#lang-menu');
            initLangDropdown('#sidebar-lang-dropdown', '#sidebar-lang-trigger', '#sidebar-lang-menu');

            // Profile modal
            const profileModal = $('#profile-modal');
            const profileCloseBtn = $('#profile-close');
            const profileBtnMobile = $('#profile-btn-mobile');
            const profileBtnDesktop = $('#profile-btn-desktop');
            const profileUserGreeting = $('#user-greeting');
            const sidebarProfileBtn = $('#sidebar-profile-btn');

            function openProfileModal() {
                if (profileModal) {
                    const user = auth.getUser();
                    const profileName = $('#profile-name');
                    const profileEmail = $('#profile-email');
                    if (profileName) profileName.textContent = user?.name || 'User';
                    if (profileEmail) profileEmail.textContent = user?.email || 'user@email.com';
                    profileModal.style.display = 'flex';
                    addClass(profileModal, 'active');
                }
            }

            function closeProfileModal() {
                if (profileModal) {
                    removeClass(profileModal, 'active');
                    setTimeout(() => { profileModal.style.display = 'none'; }, 300);
                }
            }

            if (profileBtnMobile) on(profileBtnMobile, 'click', openProfileModal);
            if (profileBtnDesktop) on(profileBtnDesktop, 'click', openProfileModal);
            if (profileUserGreeting) on(profileUserGreeting, 'click', openProfileModal);
            if (sidebarProfileBtn) on(sidebarProfileBtn, 'click', (e) => { e.preventDefault(); openProfileModal(); removeClass(sidebar, 'active'); if (sidebarToggle) sidebarToggle.setAttribute('aria-expanded', 'false'); });
            if (profileCloseBtn) on(profileCloseBtn, 'click', closeProfileModal);
            if (profileModal) on(profileModal, 'click', (e) => { if (e.target === profileModal) closeProfileModal(); });
            const profileLogoutBtn = $('#profile-logout-btn');
            if (profileLogoutBtn) on(profileLogoutBtn, 'click', () => { auth.logout(); closeProfileModal(); window.location.href = '/'; });

            on(document, 'click', () => {
                ['#lang-menu', '#sidebar-lang-menu'].forEach((id) => { const el = $(id); if (el) el.classList.remove('active'); });
                ['#lang-dropdown', '#sidebar-lang-dropdown'].forEach((id) => { const dd = $(id); if (dd) dd.setAttribute('aria-expanded', 'false'); });
            });

            updateTranslations();

            // Members Page Logic
            const addMemberBtn = $('#add-member-btn');
            const addMemberEmpty = $('#add-member-empty');
            const addMemberModal = $('#add-member-modal');
            const addMemberClose = $('#add-member-close');
            const addMemberForm = $('#add-member-form');
            const addMemberStatus = $('#add-member-status');
            const membersGrid = $('#members-grid');
            const emptyState = $('#empty-state');
            const skeletonLoading = $('#skeleton-loading');
            const memberSearch = $('#member-search');
            const memberFilter = $('#member-filter');
            const memberSort = $('#member-sort');

            const professionOptions = ['Doctor', 'Engineer', 'Teacher', 'Business', 'Student', 'Designer', 'Homemaker'];

            function formatFamilyName(headName = '') {
                const first = headName.trim().split(' ')[0];
                if (!first) return '';
                const capitalized = first.charAt(0).toUpperCase() + first.slice(1);
                return `${capitalized}'s family`;
            }

            function roleLabel(role) {
                if (role === 'married') return i18next.t('members.roleMarried') || 'Married';
                if (role === 'unmarried') return i18next.t('members.roleUnmarried') || 'Unmarried';
                return role;
            }

            const setStatus = (el, type = '', message = '') => {
                if (!el) return;
                el.textContent = message;
                el.className = 'form-status';
                if (type) el.classList.add(type);
            };

            let members = [];

            async function loadMembers() {
                if (skeletonLoading) skeletonLoading.style.display = 'grid';
                if (membersGrid) membersGrid.style.display = 'none';
                try {
                    const { data } = await api.get('/members');
                    members = Array.isArray(data) ? data : [];
                    renderMembers(memberSearch?.value || '', memberFilter?.value || '', memberSort?.value || 'name');
                } catch (error) {
                    console.error('Failed to load members', error);
                    setStatus(addMemberStatus, 'error', 'Failed to load members.');
                } finally {
                    if (skeletonLoading) skeletonLoading.style.display = 'none';
                    if (membersGrid) membersGrid.style.display = 'grid';
                }
            }

            const professionSelect = $('#member-profession-select');
            if (professionSelect) {
                professionSelect.innerHTML = `
                    <option value="" disabled data-i18n="members.tagsPlaceholder">Select professions</option>
                    ${professionOptions.map(p => `<option value="${p}">${p}</option>`).join('')}
                `;
            }

            function initials(name) {
                return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            function renderMembers(search = '', role = '', sort = 'name') {
                if (!membersGrid) return;
                let filtered = members.filter(m => {
                    const text = `${m.name} ${m.family} ${m.location || ''} ${(m.tags || []).join(' ')}`.toLowerCase();
                    const matchesSearch = text.includes(search.toLowerCase());
                    const matchesRole = !role || m.role === role;
                    return matchesSearch && matchesRole;
                });

                // basic sorting
                if (sort === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));
                if (sort === 'age') filtered.sort((a, b) => (a.age || 0) - (b.age || 0));
                if (sort === 'recent') filtered.sort((a, b) => b.id - a.id);

                if (filtered.length === 0) {
                    if (emptyState) emptyState.style.display = 'flex';
                    membersGrid.style.display = 'none';
                    return;
                }

                if (emptyState) emptyState.style.display = 'none';
                membersGrid.style.display = 'grid';

                membersGrid.innerHTML = filtered.map(member => `
                    <div class="member-card" data-id="${member.id}">
                        <div class="member-card-top">
                            <div class="member-avatar">${initials(member.name)}</div>
                            <div class="member-info">
                                <div class="member-name-line">
                                    <h3 class="member-name">${member.name}</h3>
                                    <span class="member-role-badge">${roleLabel(member.role)}</span>
                                </div>
                                <div class="member-subline">
                                    <span class="member-family">${member.family}</span>
                                </div>
                            </div>
                            <div class="member-card-actions">
                                <button class="btn-icon" title="Edit" data-action="edit" data-id="${member.id}">✏️</button>
                                <button class="btn-icon" title="Delete" data-action="delete" data-id="${member.id}">🗑️</button>
                            </div>
                        </div>
                        <div class="member-card-body">
                            <div class="member-meta">
                                ${member.age ? `<span>🎂 ${member.age} yrs</span>` : ''}
                                ${member.location ? `<span>📍 ${member.location}</span>` : ''}
                            </div>
                            ${(member.phone || member.email) ? `<div class="member-contact">${member.phone ? `📞 ${member.phone}` : ''} ${member.email ? ` | 📧 ${member.email}` : ''}</div>` : ''}
                            ${member.tags?.length ? `<div class="member-tags">${member.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
                        </div>
                        <div class="member-card-footer">
                            <button class="btn btn-outline btn-sm" data-action="view" data-id="${member.id}" data-i18n="members.viewProfile">View Profile</button>
                        </div>
                    </div>
                `).join('');

                membersGrid.querySelectorAll('[data-action]').forEach(btn => on(btn, 'click', handleMemberAction));
                updateTranslations();
            }

            async function handleMemberAction(e) {
                const action = e.currentTarget.getAttribute('data-action');
                const id = parseInt(e.currentTarget.getAttribute('data-id'));
                if (action === 'delete') {
                    if (!confirm('Delete this member?')) return;
                    try {
                        await api.delete(`/members/${id}`);
                        members = members.filter(m => m.id !== id);
                        renderMembers(memberSearch?.value || '', memberFilter?.value || '', memberSort?.value || 'name');
                    } catch (error) {
                        console.error('Failed to delete member', error);
                        alert('Failed to delete member. Please try again.');
                    }
                }
            }

            function openAddMemberModal() {
                if (addMemberModal) {
                    addMemberModal.style.display = 'flex';
                    addClass(addMemberModal, 'active');
                }
            }
            
            function closeAddMemberModal() {
                if (addMemberModal) {
                    removeClass(addMemberModal, 'active');
                    setTimeout(() => { addMemberModal.style.display = 'none'; }, 300);
                }
                if (addMemberForm) addMemberForm.reset();
            }

            if (addMemberBtn) on(addMemberBtn, 'click', openAddMemberModal);
            if (addMemberEmpty) on(addMemberEmpty, 'click', openAddMemberModal);
            if (addMemberClose) on(addMemberClose, 'click', closeAddMemberModal);
            if (addMemberModal) on(addMemberModal, 'click', (e) => { if (e.target === addMemberModal) closeAddMemberModal(); });

            if (addMemberForm) on(addMemberForm, 'submit', async (e) => {
                e.preventDefault();
                const name = $('#member-name-input')?.value.trim();
                const familyHead = $('#member-family-input')?.value.trim();
                const family = formatFamilyName(familyHead);
                const role = $('#member-role-input')?.value;
                const age = parseInt($('#member-age-input')?.value || '0', 10) || undefined;
                const phone = $('#member-phone-input')?.value.trim();
                const email = $('#member-email-input')?.value.trim();
                const tags = Array.from($('#member-profession-select')?.selectedOptions || []).map(o => o.value).filter(Boolean);
                if (!name || !familyHead || !role) {
                    setStatus(addMemberStatus, 'error', 'Name, family, and role are required.');
                    return;
                }
                try {
                    setStatus(addMemberStatus, '', '');
                    const { data } = await api.post('/members', {
                        name,
                        familyHeadFirstName: familyHead,
                        role,
                        age,
                        phone,
                        email,
                        tags
                    });
                    members.push(data);
                    closeAddMemberModal();
                    renderMembers(memberSearch?.value || '', memberFilter?.value || '', memberSort?.value || 'name');
                } catch (error) {
                    console.error('Failed to create member', error);
                    const message = error?.response?.data?.message || 'Failed to create member. Please try again.';
                    setStatus(addMemberStatus, 'error', message);
                }
            });

            if (memberSearch) on(memberSearch, 'input', (e) => { renderMembers(e.target.value, memberFilter?.value || '', memberSort?.value || 'name'); });
            if (memberFilter) on(memberFilter, 'change', (e) => { renderMembers(memberSearch?.value || '', e.target.value, memberSort?.value || 'name'); });
            if (memberSort) on(memberSort, 'change', (e) => { renderMembers(memberSearch?.value || '', memberFilter?.value || '', e.target.value); });

            loadMembers();
            console.log('✨ Members page loaded successfully!');
        }
    </script>
</body>

</html>
